version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /shared
      - /services/order-service
      - /services/inventory-service
      - /services/cdc-connector
      - /services/user-service
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /services/order-service
      - /services/inventory-service
      - /services/cdc-connector
      - /services/user-service
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
